<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1218">
  <title>야자 괴담</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="app">

    <section class="screen home" id="home" aria-label="시작 화면">
      <div class="home-stage">
        <canvas id="backdrop" width="320" height="180"></canvas>
      </div>
      <div class="home-copy">
        <h1 id="title">야자 괴담.</h1>
        <p class="live" id="homeLive"></p>
        <nav class="home-nav" aria-label="메뉴">
          <button class="btn primary big" data-go="stages">출전</button>
          <button class="btn big" data-go="formation">편성</button>
          <button class="btn big" data-go="gacha">문방구</button>
          <button class="btn big" id="openMissions">임무<i class="nav-badge" id="missionBadge" hidden></i></button>
          <button class="btn big" data-go="dex" id="openDex">도감<small id="dexCount"></small></button>
        </nav>
        <button class="btn ghost" id="openSettings">소리 설정</button>
      </div>
    </section>

    <section class="screen sub" id="stages" aria-label="스테이지 선택">
      <header class="bar">
        <button class="btn ghost" data-go="home">← 처음</button>
        <h2>어디부터.</h2>
        <div class="purse" data-purse></div>
      </header>
      <div class="chapter-nav">
        <button class="btn ghost" id="chPrev" aria-label="이전 장">←</button>
        <button class="chapter-title" id="chTitle" aria-label="장 목록 열기">
          <b id="chName"></b>
          <span id="chProg"></span>
        </button>
        <button class="btn ghost" id="chNext" aria-label="다음 장">→</button>
      </div>
      <div class="stage-list" id="stageList"></div>
    </section>

    <section class="screen sub" id="formation" aria-label="편성">
      <header class="bar">
        <button class="btn ghost" data-go="home">← 처음</button>
        <h2>누굴 보낼까.</h2>
        <div class="purse" data-purse></div>
      </header>
      <div class="formation">
        <div class="deck-row">
          <p class="eyebrow">출전 <span id="deckCount"></span></p>
          <div class="deck" id="deck"></div>
        </div>
        <div class="roster-wrap">
          <div class="roster-col">
            <div class="roster-head">
              <div class="seg five" id="rosterFilter" role="tablist" aria-label="등급 필터">
                <button data-grade="all">전체</button>
                <button data-grade="4">4등급</button>
                <button data-grade="3">3등급</button>
                <button data-grade="2">2등급</button>
                <button data-grade="1">1등급</button>
                <button data-grade="0">만점</button>
              </div>
              <span class="eyebrow">보유 <b id="rosterCount"></b></span>
            </div>
            <div class="roster" id="roster"></div>
          </div>
          <aside class="detail" id="detail"></aside>
        </div>
      </div>
    </section>

    <section class="screen sub" id="gacha" aria-label="뽑기">
      <header class="bar">
        <button class="btn ghost" data-go="home">← 처음</button>
        <h2>문방구 열었다.</h2>
        <div class="purse" data-purse></div>
      </header>
      <div class="gacha">
        <div class="machine-wrap"><canvas id="machine" width="72" height="104"></canvas></div>
        <div class="gacha-panel">
          <div class="seg" id="bannerTabs" role="tablist" aria-label="뽑기 종류">
            <button role="tab" data-banner="normal">상시</button>
            <button role="tab" data-banner="limited">기간 한정</button>
          </div>
          <div class="banner-info" id="bannerInfo" hidden></div>
          <p class="pity" id="pityLine"></p>
          <div class="pull-row">
            <button class="btn big" id="pull1"><span>1회</span><b class="cost" id="cost1"></b></button>
            <button class="btn primary big" id="pull11"><span>11연차</span><b class="cost" id="cost11"></b></button>
          </div>
          <p class="hint" id="pullHint"></p>
          <details class="rates">
            <summary>확률 보기</summary>
            <div id="rateTable"></div>
          </details>
        </div>
      </div>
    </section>

    <section class="screen sub" id="dex" aria-label="괴담 도감">
      <header class="bar">
        <button class="btn ghost" data-go="home">← 처음</button>
        <h2 id="dexTitle">괴담 도감.</h2>
        <div class="purse"><span class="pill"><span id="dexFoundLabel">발견</span> <b id="dexFound"></b></span></div>
      </header>
      <div class="dex-wrap">
        <div class="dex-tools">
          <div class="seg" id="dexMode" role="group" aria-label="도감 종류">
            <button data-mode="enemy">괴담</button>
            <button data-mode="unit">동료</button>
          </div>
        </div>
        <div class="dex-tools" id="dexEnemyTools">
          <div class="seg flow" id="dexKind" role="group" aria-label="종류">
            <button data-kind="all">전체</button>
            <button data-kind="mob">잡몹</button>
            <button data-kind="boss">보스</button>
          </div>
          <div class="seg flow" id="dexRegion" role="group" aria-label="지역" hidden></div>
          <span class="eyebrow" id="dexShown"></span>
        </div>
        <div class="dex-tools" id="dexUnitTools" hidden>
          <div class="seg flow" id="dexGrade" role="group" aria-label="등급">
            <button data-grade="all">전체</button>
            <button data-grade="4">4등급</button>
            <button data-grade="3">3등급</button>
            <button data-grade="2">2등급</button>
            <button data-grade="1">1등급</button>
            <button data-grade="0">만점</button>
          </div>
          <div class="seg flow" id="dexHave" role="group" aria-label="보유">
            <button data-have="all">모두</button>
            <button data-have="own">보유</button>
            <button data-have="none">미보유</button>
          </div>
          <span class="eyebrow" id="dexUnitShown"></span>
        </div>
        <div class="dex-grid" id="dexGrid"></div>
      </div>
    </section>

    <section class="screen battle" id="battle" aria-label="전투">
      <div class="b-top">
        <div class="b-name"><span id="bSub"></span> <b id="bName"></b></div>
        <div class="b-time" id="bTime">0:00</div>
        <div class="b-ctl">
          <button class="btn small" id="bMute" aria-label="소리">소리</button>
          <button class="btn small" id="bSpeed" aria-label="배속">×1</button>
          <button class="btn small" id="bPause" aria-label="일시정지">멈춤</button>
        </div>
      </div>
      <div class="b-field" id="bField">
        <canvas id="field" width="320" height="180"></canvas>
        <div class="cutin" id="cutin" aria-hidden="true"></div>
        <div class="b-bars">
          <div class="hp ally"><span>교실</span><i><b id="hpAlly"></b></i><em id="hpAllyNum"></em></div>
          <div class="hp enemy"><span id="hpEnemyName">근원</span><i><b id="hpEnemy"></b></i><em id="hpEnemyNum"></em></div>
        </div>
        <div class="seen-banner" id="seenBanner" role="status" aria-live="polite"></div>
      </div>
      <div class="b-console" id="bConsole">
        <div class="money-box">
          <div class="money"><b id="money">0</b><span id="moneyMax">/ 500</span></div>
          <button class="up" id="upBtn"><span>매점 확장</span><em id="upLv">Lv1</em><b id="upCost"></b></button>
        </div>
        <div class="slots" id="slots"></div>
        <button class="cannon" id="cannonBtn"><span>방송 대포</span><i><b id="cannonFill"></b></i></button>
      </div>
    </section>

  </main>

  <dialog id="pullResult" class="sheet">
    <div class="sheet-head">
      <h3 id="pullTitle">결과.</h3>
      <p class="eyebrow" id="pullSummary"></p>
    </div>
    <div class="pull-grid" id="pullGrid"></div>
    <div class="sheet-actions">
      <button class="btn" id="pullClose">닫기</button>
      <button class="btn primary" id="pullAgain">한 번 더</button>
    </div>
  </dialog>

  <dialog id="battleEnd" class="sheet small">
    <div class="sheet-head">
      <h3 id="endTitle"></h3>
      <p class="eyebrow" id="endSub"></p>
    </div>
    <div class="reward" id="endReward"></div>
    <div class="sheet-actions">
      <button class="btn" id="endExit">나가기</button>
      <button class="btn primary" id="endRetry">다시</button>
    </div>
  </dialog>

  <dialog id="pauseDlg" class="sheet small">
    <div class="sheet-head"><h3>멈춤.</h3></div>
    <div class="sheet-actions">
      <button class="btn" id="pauseQuit">포기</button>
      <button class="btn primary" id="pauseResume">계속</button>
    </div>
  </dialog>

  <dialog id="chapterDlg" class="sheet">
    <div class="sheet-head">
      <h3>장 목록.</h3>
      <p class="eyebrow" id="chapterSummary"></p>
    </div>
    <div class="chap-grid" id="chapterGrid"></div>
    <div class="sheet-actions"><button class="btn primary" id="chapterClose">닫기</button></div>
  </dialog>

  <dialog id="missionDlg" class="sheet mission" aria-labelledby="missionTitle">
    <div class="sheet-head">
      <div class="mission-top">
        <div>
          <h3 id="missionTitle">임무.</h3>
          <p class="eyebrow" id="missionSub"></p>
        </div>
        <div class="purse" data-purse></div>
      </div>
      <div class="seg" id="missionTabs" role="tablist" aria-label="임무 종류">
        <button role="tab" id="tabDaily" data-tab="daily" aria-controls="missionBody">오늘<i class="tab-n" hidden></i></button>
        <button role="tab" id="tabAch" data-tab="ach" aria-controls="missionBody">업적<i class="tab-n" hidden></i></button>
      </div>
    </div>
    <div class="mission-body" id="missionBody" role="tabpanel" tabindex="-1"></div>
    <p class="sr-only" id="missionNote" role="status" aria-live="polite"></p>
    <div class="sheet-actions">
      <button class="btn" id="missionClose">닫기</button>
      <button class="btn primary" id="missionAll">모두 받기</button>
    </div>
  </dialog>

  <dialog id="dexDlg" class="sheet dex" aria-labelledby="dexName">
    <div class="dex-stage">
      <canvas id="dexCanvas" width="320" height="180" role="img" aria-label="괴담 장면"></canvas>
      <button class="btn small dex-x" id="dexX">닫기</button>
    </div>
    <div class="dex-cap">
      <div class="dex-cap-top">
        <span class="pips" id="dexPips" aria-hidden="true"><i class="pip"></i><i class="pip"></i><i class="pip"></i></span>
        <span class="dex-phase" id="dexPhase"></span>
      </div>
      <p class="dex-line" id="dexLine"></p>
      <p class="sr-only" id="dexSr"></p>
    </div>
    <div class="dex-info">
      <div class="dex-head">
        <h3 id="dexName"></h3>
        <div class="chips" id="dexChips"></div>
      </div>
      <div class="stat-grid" id="dexStats"></div>
      <p class="dex-note">기본 수치(×1)다. 스테이지에 따라 배율이 붙는다.</p>
      <p class="dex-desc" id="dexDesc"></p>
      <p class="dex-credit" id="dexCredit" hidden></p>
      <div class="dex-var">
        <p class="eyebrow">색 변종</p>
        <div class="dex-vars" id="dexVars"></div>
      </div>
    </div>
    <div class="sheet-actions">
      <button class="btn" id="dexReplay">다시 보기</button>
      <button class="btn primary" id="dexClose">닫기</button>
    </div>
  </dialog>

  <dialog id="unitDlg" class="sheet dex unit" aria-labelledby="udName">
    <div class="dex-stage">
      <canvas id="udCanvas" width="320" height="180" role="img" aria-label="공격 모션"></canvas>
      <button class="btn small dex-x" id="udX">닫기</button>
    </div>
    <div class="dex-cap">
      <div class="ud-forms" id="udForms" role="group" aria-label="모습"></div>
      <p class="dex-line" id="udBlurb"></p>
    </div>
    <div class="dex-info">
      <div class="dex-head">
        <h3 id="udName"></h3>
        <div class="chips" id="udChips"></div>
      </div>
      <div class="stat-grid" id="udStats"></div>
      <p class="dex-note" id="udNote"></p>
      <div class="abil" id="udAbil"></div>
      <div class="ud-own" id="udOwn"></div>
      <div class="ud-get">
        <p class="eyebrow">얻는 곳</p>
        <p id="udGet"></p>
      </div>
    </div>
    <div class="sheet-actions">
      <button class="btn" id="udFormation">편성에서 보기</button>
      <button class="btn primary" id="udClose">닫기</button>
    </div>
  </dialog>

  <dialog id="settingsDlg" class="sheet small">
    <div class="sheet-head">
      <h3>소리.</h3>
      <p class="eyebrow" id="bgmHint"></p>
    </div>
    <div class="vol-list">
      <label class="vol"><span>전체</span><input type="range" id="vol-master" min="0" max="100"><output></output></label>
      <label class="vol"><span>효과음</span><input type="range" id="vol-sfx" min="0" max="100"><output></output></label>
      <label class="vol"><span>배경음</span><input type="range" id="vol-bgm" min="0" max="100"><output></output></label>
      <label class="check"><input type="checkbox" id="vol-mute"><span>모두 끄기</span></label>
    </div>
    <div class="sheet-actions"><button class="btn primary" id="settingsClose">닫기</button></div>
  </dialog>

  <dialog id="debugDlg" class="sheet small">
    <div class="sheet-head"><h3>디버그.</h3><p class="eyebrow">개발용 패널</p></div>
    <div class="debug-grid">
      <button class="btn" data-dbg="coins">동전 +10,000</button>
      <button class="btn" data-dbg="xp">경험치 +1,000</button>
      <button class="btn" data-dbg="pens">형광펜 +20</button>
      <button class="btn" data-dbg="shards">조각 +10</button>
      <button class="btn" data-dbg="all">전 유닛 해금</button>
      <button class="btn" data-dbg="pity">천장 초기화</button>
      <button class="btn" data-dbg="missionDone">오늘 임무 전부 완료</button>
      <button class="btn" data-dbg="missionReset">임무/기록 초기화</button>
      <button class="btn" data-dbg="dexAll">도감 전부 해금</button>
      <button class="btn" data-dbg="dexReset">도감 초기화</button>
      <button class="btn" data-dbg="clear">스테이지 전부 해금</button>
      <button class="btn danger" data-dbg="reset">세이브 초기화</button>
    </div>
    <div class="sheet-actions"><button class="btn primary" id="debugClose">닫기</button></div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/units2.js"></script>
  <script src="js/units3.js"></script>
  <script src="js/evolutions.js"></script>
  <script src="js/bestiary.js"></script>
  <script src="js/bestiary2.js"></script>
  <script src="js/bestiary3.js"></script>
  <script src="js/world.js"></script>
  <script src="js/world2.js"></script>
  <script src="js/world3.js"></script>
  <script src="js/lore_world.js"></script>
  <script src="js/lore_scp.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/game.js"></script>
  <script src="js/lore.js"></script>
  <script src="js/dex.js"></script>
  <script src="js/unitdex.js"></script>
  <script src="js/missions.js"></script>
  <script src="js/poses.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/sprites2.js"></script>
  <script src="js/sprites3.js"></script>
  <script src="js/sprites4.js"></script>
  <script src="js/scenery.js"></script>
  <script src="js/scenery2.js"></script>
  <script src="js/scenery3.js"></script>
  <script src="js/render.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/cutscene.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
