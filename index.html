<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1020">
  <title>뭐든 던져</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="app">
    <header class="hud">
      <div class="stage" id="stageBox"><b id="stageNum">스테이지 1</b><span id="stageSub">들판</span></div>
      <div class="gold" aria-label="골드"><span id="goldIcon" class="icon"></span><span id="goldNum">0</span></div>
      <div class="gold ruby" aria-label="루비"><span id="rubyIcon" class="icon"></span><span id="rubyNum">0</span></div>
    </header>

    <div class="info" aria-label="전투 정보">
      <div class="side me">
        <div class="row1"><span class="nm" id="meName">나</span><span class="hp" id="meHp">100/100</span></div>
        <div class="bar2"><i id="meHpBar"></i></div>
        <div class="row2"><span id="meAtkIcon" class="icon"></span>한 바퀴 <b id="meAtk">0</b></div>
      </div>
      <div class="side foe" id="foe">
        <div class="row1"><span class="nm" id="foeName">-</span><span class="hp" id="foeHp">-</span></div>
        <div class="bar2"><i id="foeHpBar"></i></div>
        <div class="row2">공격력 <b id="foeAtk">-</b></div>
      </div>
    </div>

    <section class="battle" aria-label="전투 화면"><canvas id="battle"></canvas>
      <div class="dialog" id="dialog" hidden>
        <canvas id="dlgFace" width="16" height="16"></canvas>
        <div class="dtxt"><div class="dname"><b id="dlgName"></b><small id="dlgTitle"></small></div><p id="dlgText"></p></div>
        <span class="dnext" id="dlgNext">▶</span>
      </div>
    </section>

    <div class="bar">
      <div class="skills">
        <button class="skill" id="skRain" type="button" aria-label="쏟아지기 스킬"><span id="skRainIcon" class="icon x2"></span><span class="cd"></span><small>쏟아지기</small></button>
        <button class="skill" id="skRage" type="button" aria-label="분노 스킬"><span id="skRageIcon" class="icon x2"></span><span class="cd"></span><small>분노</small></button>
        <button class="skill" id="skShadow" type="button" aria-label="그림자 분신 스킬"><span id="skShadowIcon" class="icon x2"></span><span class="cd"></span><small>분신</small></button>
        <button class="skill" id="skBarrage" type="button" aria-label="난사 스킬"><span id="skBarrageIcon" class="icon x2"></span><span class="cd"></span><small>난사</small></button>
        <button class="skill" id="skBolt" type="button" aria-label="뇌전 스킬"><span id="skBoltIcon" class="icon x2"></span><span class="cd"></span><small>뇌전</small></button>
        <button class="skill" id="skDark" type="button" aria-label="어둠장막 스킬"><span id="skDarkIcon" class="icon x2"></span><span class="cd"></span><small>어둠</small></button>
      </div>
      <div class="acts">
        <button class="skill boss" id="bossBtn" type="button" aria-label="보스전"><span id="bossIcon" class="icon x2"></span><span class="cd"></span><small id="bossLabel">보스 1</small></button>
        <button class="skill mine" id="mineBtn" type="button" aria-label="광산"><span id="mineIcon" class="icon x2"></span><span class="cd"></span><small id="mineLabel">광산</small></button>
        <button class="skill chase" id="chaseBtn" type="button" aria-label="추격전"><span id="chaseIcon" class="icon x2"></span><span class="cd"></span><small id="chaseLabel">추격</small></button>
        <button class="skill defend" id="defendBtn" type="button" aria-label="방어전"><span id="defendIcon" class="icon x2"></span><span class="cd"></span><small id="defendLabel">방어</small></button>
        <button class="craft" id="craft" type="button" aria-label="물건 만들기">
          <span class="face"><span id="craftIcon" class="icon"></span>만들기 <span id="craftCount">5/5</span><span class="fill" id="craftFill"></span></span>
        </button>
      </div>
    </div>

    <section class="field" id="field" aria-label="필드. 같은 물건을 끌어다 겹치면 합쳐져요"><canvas id="fieldCv"></canvas><div class="fieldtag"><span id="countIcon" class="icon"></span><b id="countNum">0/8</b><span class="auto" id="autoTag"></span></div></section>

    <nav class="dock">
      <button class="tab" id="tabUp" type="button"><span id="upIcon" class="icon"></span>강화<span class="dot" id="upDot" hidden></span></button>
      <button class="tab" id="tabAb" type="button"><span id="abIcon" class="icon"></span>능력<span class="dot" id="abDot" hidden></span></button>
      <button class="tab" id="tabPet" type="button"><span id="petIcon" class="icon"></span>동료<span class="dot" id="petDot" hidden></span></button>
      <button class="tab" id="tabShop" type="button"><span id="shopIcon" class="icon"></span>상점<span class="dot" id="shopDot" hidden></span></button>
      <button class="tab" id="tabQuest" type="button"><span id="questIcon" class="icon"></span>임무<span class="dot" id="questDot" hidden></span></button>
      <button class="tab" id="tabSet" type="button"><span id="setIcon" class="icon"></span>설정</button>
    </nav>

    <section class="sheet" id="sheet" aria-hidden="true">
      <header><h2 id="sheetTitle">강화</h2><button type="button" id="sheetClose">닫기</button></header>
      <div class="body" id="sheetBody"></div>
    </section>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <div class="modal gacha" id="gacha" hidden>
      <div class="box card">
        <canvas id="gachaCv" width="64" height="64"></canvas>
        <div class="got" id="gachaGot"></div>
        <button type="button" class="primary" id="gachaOk">확인</button>
      </div>
    </div>

    <div class="comic" id="comic" hidden aria-label="프롤로그 만화">
      <div class="comic-top"><b>프롤로그</b><button type="button" id="comicSkip">건너뛰기</button></div>
      <div class="comic-scroll" id="comicScroll"></div>
    </div>

    <div class="modal" id="offline" hidden>
      <div class="card">
        <span id="offIcon" class="icon x2"></span>
        <h2>자리 비운 동안</h2>
        <p id="offText">-</p>
        <button type="button" id="offOk" class="primary">받기</button>
      </div>
    </div>
  </main>

  <script src="js/format.js"></script>
  <script src="js/items.js"></script>
  <script src="js/story.js"></script>
  <script src="js/core.js"></script>
  <script src="js/sprite.js"></script>
  <script src="js/spr_hero.js"></script>
  <script src="js/spr_pet_monkey.js"></script>
  <script src="js/spr_pet_hippo.js"></script>
  <script src="js/spr_pet_bear.js"></script>
  <script src="js/spr_pet_dragon.js"></script>
  <script src="js/spr_mine.js"></script>
  <script src="js/spr_chase.js"></script>
  <script src="js/spr_pet_pig.js"></script>
  <script src="js/spr_pet_mole.js"></script>
  <script src="js/spr_ability.js"></script>
  <script src="js/spr_v06.js"></script>
  <script src="js/spr_story.js"></script>
  <script src="js/spr_v07.js"></script>
  <script src="js/spr_v08.js"></script>
  <script src="js/spr_mob_slime.js"></script>
  <script src="js/spr_mob_field.js"></script>
  <script src="js/spr_mob_forest.js"></script>
  <script src="js/spr_mob_cave.js"></script>
  <script src="js/spr_mob_volcano.js"></script>
  <script src="js/spr_mob_ice.js"></script>
  <script src="js/spr_mob_space.js"></script>
  <script src="js/spr_map_desert.js"></script>
  <script src="js/spr_map_swamp.js"></script>
  <script src="js/spr_map_ocean.js"></script>
  <script src="js/spr_map_sky.js"></script>
  <script src="js/spr_map_factory.js"></script>
  <script src="js/spr_map_abyss.js"></script>
  <script src="js/spr_items_a.js"></script>
  <script src="js/spr_items_b.js"></script>
  <script src="js/spr_items_c.js"></script>
  <script src="js/spr_items_d.js"></script>
  <script src="js/spr_items_e.js"></script>
  <script src="js/spr_items_f.js"></script>
  <script src="js/spr_items_g.js"></script>
  <script src="js/spr_items_h.js"></script>
  <script src="js/spr_items_i.js"></script>
  <script src="js/spr_relics.js"></script>
  <script src="js/spr_v05.js"></script>
  <script src="js/spr_ui2.js"></script>
  <script src="js/spr_bg.js"></script>
  <script src="js/spr_fx.js"></script>
  <script data-dom src="js/comic.js"></script>
  <script data-dom src="js/render.js"></script>
  <script data-dom src="js/ui.js"></script>
  <script data-dom src="js/main.js"></script>
</body>
</html>
