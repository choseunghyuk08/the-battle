<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>sprite preview</title>
<style>body{margin:0;background:#0e1319;color:#efe9dc;font:12px sans-serif}canvas{image-rendering:pixelated;display:block}</style></head>
<body><canvas id="sheet"></canvas><canvas id="scene" width="640" height="360" style="width:960px;height:540px"></canvas>
<script src="../js/data.js"></script><script src="../js/units2.js"></script><script src="../js/units3.js"></script><script src="../js/evolutions.js"></script><script src="../js/bestiary.js"></script><script src="../js/bestiary2.js"></script><script src="../js/bestiary3.js"></script><script src="../js/sizes.js"></script><script src="../js/engine.js"></script><script src="../js/game.js"></script>
<script src="../js/poses.js"></script><script src="../js/sprites.js"></script><script src="../js/sprites2.js"></script><script src="../js/sprites3.js"></script><script src="../js/sprites4.js"></script><script src="../js/hd.js"></script><script src="../js/hdu.js"></script><script src="../js/hd_examples.js"></script><script src="../js/hd_animals.js"></script><script src="../js/hd_furniture.js"></script><script src="../js/hd_objects.js"></script><script src="../js/hd_spirits.js"></script><script src="../js/hd_boss_a.js"></script><script src="../js/hd_boss_b.js"></script><script src="../js/hd_east.js"></script><script src="../js/hd_boss_east.js"></script><script src="../js/hd_world.js"></script><script src="../js/hd_americas.js"></script><script src="../js/hd_scp_a.js"></script><script src="../js/hd_scp_b.js"></script><script src="../js/hd_scp_boss.js"></script><script src="../js/hdu_examples.js"></script><script src="../js/hdu_hair.js"></script><script src="../js/hdu_hats_a.js"></script><script src="../js/hdu_hats_b.js"></script><script src="../js/hdu_props_a.js"></script><script src="../js/hdu_props_b.js"></script><script src="../js/hdu_props_c.js"></script><script src="../js/hdu_props_d.js"></script><script src="../js/hdu_wear.js"></script><script src="../js/render.js"></script>
<script>
const YG = globalThis.YG;
const q = new URLSearchParams(location.search);
const anim = q.get('anim') || 'atk';
const pick = (kind, ids) => ids.map((n) => kind + n);
const phases = q.get('frames') ? q.get('frames').split(',')
  : anim === 'atk' ? [...pick('atk', [0, 3, 6, 9, 12, 14, 15, 16, 18, 20, 22, 23]), 'hurt0']
  : anim === 'walk' ? [...pick('walk', [0, 2, 4, 6, 8, 10, 12, 14]), 'idle0']
  : [...pick('idle', [0, 2, 4, 6, 8, 10]), 'hurt0', 'hurt1', 'hurt2', 'hurt3'];
const set = new URLSearchParams(location.search).get('set') || 'units';
const evoLv = Number(q.get('lv') || 1);
const evolved = YG.UNITS.map((u) => YG.resolveDef(u, evoLv));
const OLD = ['dust','ghost','mannequin','shadow','locker','portrait','tray','skeleton','mirror','principal','megamirror'];
const mobs = YG.ENEMIES.filter((e) => !e.boss && !e.region && !OLD.includes(e.id));
const bosses = YG.ENEMIES.filter((e) => e.boss && !e.region && !OLD.includes(e.id));
/* 해외편: ?set=abroad (잡몹) / abroadboss, region=일본 으로 지역 고르기, ids=a,b 로 직접 고르기 */
const region = q.get('region');
const abroad = YG.ENEMIES.filter((e) => e.region && e.region !== '재단' && !e.boss && (!region || e.region === region));
const abroadBoss = YG.ENEMIES.filter((e) => e.region && e.region !== '재단' && e.boss && (!region || e.region === region));
/* SCP 재단편: ?set=scp (잡몹) / scpboss */
const scp = YG.ENEMIES.filter((e) => e.region === '재단' && !e.boss);
const scpBoss = YG.ENEMIES.filter((e) => e.region === '재단' && e.boss);
const picked = (q.get('ids') || '').split(',').filter(Boolean).map((i) => YG.enemyById(i));
const variants = ['rat:red','bat:blue','zombie:violet','vending:gold','cat:ink','slimeking:red','mecha:gold','librarian:violet'].map((i) => YG.enemyById(i));
const defs = picked.length ? picked : set === 'abroad' ? abroad : set === 'abroadboss' ? abroadBoss : set === 'scp' ? scp : set === 'scpboss' ? scpBoss : set === 'evo' ? evolved : set === 'enemies' ? YG.ENEMIES.filter((e) => OLD.includes(e.id)) : set === 'mobs' ? mobs : set === 'bosses' ? bosses : set === 'variants' ? variants : YG.UNITS;
/* 그림은 K배 해상도에 발밑 기준점이 붙어 있다. 모든 칸을 같은 크기로 잡고 발밑을 맞춰 그린다 */
const sc = Number(q.get('scale') || 2), K = YG.sprites.K;
let up = 0, down = 0, left = 0, right = 0;
for (const d of defs) for (const p of phases) { const f = YG.sprites.frame(d, p); up = Math.max(up, f.ay); down = Math.max(down, f.height - f.ay); left = Math.max(left, f.ax); right = Math.max(right, f.width - f.ax); }
const cw = Math.ceil((left + right) / K * sc) + 4, ch = Math.ceil((up + down) / K * sc) + 4;
const sheet = document.getElementById('sheet');
sheet.width = phases.length*cw; sheet.height = defs.length*ch;
const sctx = sheet.getContext('2d'); sctx.imageSmoothingEnabled=false;
sctx.fillStyle='#2a3641'; sctx.fillRect(0,0,sheet.width,sheet.height);
defs.forEach((d,r)=>{ phases.forEach((p,c)=>{
  const f = YG.sprites.frame(d,p);
  sctx.drawImage(f, c*cw + 2 + left/K*sc - f.ax/K*sc, r*ch + 2 + up/K*sc - f.ay/K*sc, f.width/K*sc, f.height/K*sc);
});});
const scene = document.getElementById('scene').getContext('2d');
const stage = YG.STAGES[2];
const save = YG.newSave(); ['bat','cook','tech','patrol','pe'].forEach(i=>save.owned[i]={lv:1,plus:0,shards:0,evo:0});
save.deck = ['basic','bag','tech','patrol','pe'];
const b = new YG.Battle(stage, YG.buildDeck(save), Math.random);
b.money = 5000; b.workerLv = 8; b.cannon.charge = b.cannon.max;
for (let f=0; f<60*30; f++){
  if (f%20===0) for (let i=0;i<5;i++) b.summon(i);
  b.step();
}
window.__b = b;
YG.render.battle(scene, b, stage.theme);
window.__ready = true;
</script></body></html>
